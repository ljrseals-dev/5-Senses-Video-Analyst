[project]
name = "fivesenses"
version = "0.1.0"
description = "5-Senses video model pipeline: Whisper (hearing) + ElevenLabs (voice) + Ollama (reasoning) + retrieval memory + LoRA dataset builder"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
download = ["yt-dlp"]
dev = ["pytest"]

[project.scripts]
fivesenses = "fivesenses.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
